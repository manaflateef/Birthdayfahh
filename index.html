<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1b3a;
    --night: #060d22;
    --gold: #d4af37;
    --gold-light: #f0d27a;
    --ivory: #fbf6ea;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Segoe UI", system-ui, sans-serif;
    --vtop: calc(clamp(44px, 7.5svh, 66px) + env(safe-area-inset-top, 0px));
    --goldtext: linear-gradient(180deg, #fff2c6 0%, #f3d27a 38%, #d4af37 72%, #a8801a 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--ivory); font-family: var(--sans); overflow-x: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  @keyframes enter {
    from { opacity: 0; translate: 0 18px; filter: blur(8px); }
    to   { opacity: 1; translate: 0 0;    filter: blur(0); }
  }

  /* ================= stage & background ================= */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='40'><g fill='none' stroke='%23d4af37' stroke-opacity='.11' stroke-width='1'><path d='M0 40 A40 40 0 0 1 80 40'/><path d='M10 40 A30 30 0 0 1 70 40'/><path d='M20 40 A20 20 0 0 1 60 40'/><path d='M30 40 A10 10 0 0 1 50 40'/><path d='M40 0 A40 40 0 0 1 0 40'/><path d='M40 0 A40 40 0 0 0 80 40'/></g></svg>") 0 0 / 80px 40px,
      radial-gradient(70vmax 60vmax at 50% 15%, #15306a 0%, transparent 70%),
      linear-gradient(#0b1b3a, #060d22);
  }
  .spot {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 2.4s ease;
    background: radial-gradient(ellipse 38vmax 56vmax at 50% 50%, rgba(255, 232, 170, .2), transparent 70%);
  }
  body.cake .spot { opacity: 1; transition-delay: 1.2s; }
  body.celebrate .spot { opacity: 1; background: radial-gradient(ellipse 60vmax 60vmax at 50% 55%, rgba(255, 220, 140, .22), transparent 70%); }

  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bubbles  { z-index: 1; }
  #fx       { z-index: 3; }
  #confetti { z-index: 10; }

  .rising { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; transition: opacity .6s; }
  .rise {
    position: absolute; left: var(--x); bottom: 0; width: var(--s); color: var(--c); opacity: 0;
    animation: floatUp var(--dur) linear forwards, spin var(--spin) linear infinite;
  }
  .rise svg { display: block; width: 100%; }
  @keyframes floatUp { 0% { translate: 0 40px; opacity: 0; } 10% { opacity: .85; } 100% { translate: var(--dx) calc(-100vh - 80px); opacity: .85; } }
  @keyframes spin { to { rotate: 360deg; } }

  /* ================= curtains ================= */
  .valance {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6; height: var(--vtop);
    background: linear-gradient(#1a3977, #0b1b3a); border-bottom: 3px solid var(--gold);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }
  .valance::after {
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px;
    background: radial-gradient(circle at 50% 3px, var(--gold-light) 0 4.5px, transparent 5.5px) 0 0 / 22px 14px repeat-x;
  }
  .curtain {
    position: fixed; top: 0; bottom: 0; width: 50.5%; z-index: 4;
    background:
      linear-gradient(rgba(0,0,0,.45), transparent 28%, transparent 72%, rgba(0,0,0,.55)),
      repeating-linear-gradient(90deg, rgba(0,0,0,.36) 0, rgba(255,255,255,.07) 16px, rgba(0,0,0,.36) 32px),
      linear-gradient(#17306a, #0b1b3a);
    transition: transform 2.6s cubic-bezier(.65, 0, .25, 1) .3s;
  }
  .curtain.l { left: 0;  border-right: 3px solid var(--gold); box-shadow: 10px 0 30px rgba(0,0,0,.5); }
  .curtain.r { right: 0; border-left:  3px solid var(--gold); box-shadow: -10px 0 30px rgba(0,0,0,.5); }
  body.opened .curtain.l { transform: translateX(-88%); }
  body.opened .curtain.r { transform: translateX(88%); }
  body.dressed .curtain { z-index: 1; }

  /* ================= buttons ================= */
  .btn {
    touch-action: manipulation; min-height: 48px;
    font: 500 1rem var(--sans); letter-spacing: .04em; color: var(--ivory);
    padding: .95rem 2.1rem; border-radius: 999px; border: 1px solid rgba(240, 210, 122, .5); background: rgba(255, 255, 255, .06);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer;
    transition: transform .5s var(--ease), box-shadow .5s, background .5s;
  }
  @media (hover: hover) { .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .12); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); } }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }
  .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
  .btn.primary {
    color: #0b1b3a; border-color: transparent; font-weight: 600;
    background: linear-gradient(135deg, #fbe7a1, #d4af37);
    box-shadow: 0 10px 28px rgba(212, 175, 55, .35), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .sound { position: fixed; top: calc(var(--vtop) + 18px); left: calc(.9rem + env(safe-area-inset-left, 0px)); z-index: 11; width: 42px; height: 42px; padding: 0; font-size: 1.1rem; display: grid; place-items: center; }
  .sound.off { opacity: .5; text-decoration: line-through; }

  .divider { display: flex; align-items: center; justify-content: center; gap: .8rem; width: min(280px, 64vw); margin-inline: auto; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { transform: scaleX(-1); }
  .divider i { width: 9px; height: 9px; background: var(--gold-light); rotate: 45deg; }

  /* ================= intro (on the curtains) ================= */
  .intro {
    position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center;
    gap: 1.2rem; padding: calc(var(--vtop) + 1rem) 1.5rem 1.5rem; text-align: center;
    transition: opacity .8s ease, transform 1s var(--ease), filter .8s, visibility 0s .8s;
  }
  body.opened .intro { opacity: 0; transform: scale(.96); filter: blur(8px); visibility: hidden; pointer-events: none; }
  .intro h1 {
    font: 600 clamp(2.2rem, 8vw, 4.6rem)/1.15 var(--display); letter-spacing: .06em; padding: .05em .1em .1em; max-width: 14ch;
    background: var(--goldtext); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); text-wrap: balance;
    animation: enter 1.8s var(--ease) .3s both;
  }
  .intro .divider { animation: enter 1.6s var(--ease) .7s both; }
  .intro p { font: italic 500 clamp(1.25rem, 3.6vw, 1.6rem)/1.4 var(--serif); color: rgba(251, 246, 234, .88); max-width: 28ch; animation: enter 1.8s var(--ease) 1s both; }
  .intro .reveal { margin-top: .6rem; animation: enter 1.6s var(--ease) 1.5s both; }

  /* ================= cake scene ================= */
  main {
    position: relative; z-index: 2; min-height: 100svh; min-height: 100dvh;
    display: grid; align-content: center; justify-items: center;
    gap: clamp(.4rem, 2vh, 1.4rem); padding: calc(var(--vtop) + 1.4rem) 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  body.cake main { opacity: 1; pointer-events: auto; }

  .headline { display: grid; place-items: center; text-align: center; min-height: clamp(6.5rem, 21svh, 12.5rem); }
  .headline > * { grid-area: 1 / 1; }

  .wish { font: italic 500 clamp(1.6rem, 4.8vw, 2.5rem)/1.2 var(--serif); color: var(--ivory); max-width: 22ch; opacity: 0; text-shadow: 0 0 24px rgba(240, 210, 122, .4); }
  body.cake .wish { animation: enter 1.6s var(--ease) 2.6s both; }
  body.celebrate .wish { animation: fadeOut .6s ease both; }
  @keyframes fadeOut { to { opacity: 0; translate: 0 -10px; filter: blur(6px); } }

  .title { display: grid; justify-items: center; gap: .7rem; width: 100%; }
  .script {
    display: block; text-align: center; text-wrap: balance;
    font: 600 clamp(2.4rem, 9vw, 5.4rem)/1.12 var(--display); letter-spacing: .05em;
    filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .45)) drop-shadow(0 0 22px rgba(255, 200, 90, .4));
  }
  .w {
    display: inline-block; padding: .06em .1em .14em; margin: 0 .04em;
    background:
      linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 130% 0 / 250% 100% no-repeat,
      var(--goldtext);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
    -webkit-mask-size: 260% 100%; mask-size: 260% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: 100% 0; mask-position: 100% 0;
  }
  body.celebrate .w1 { animation: write 1.8s cubic-bezier(.4, 0, .2, 1) .5s forwards, shimmer 5s ease-in-out 3s infinite; }
  body.celebrate .w2 { animation: write 2.1s cubic-bezier(.4, 0, .2, 1) 1.6s forwards, shimmer 5s ease-in-out 3.6s infinite; }
  @keyframes write { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
  @keyframes shimmer { 0%, 35% { background-position: 130% 0, 0 0; } 100% { background-position: -60% 0, 0 0; } }

  .who { display: grid; gap: .6rem; justify-items: center; opacity: 0; }
  .who .nm { font: 500 clamp(1.5rem, 4.8vw, 2.5rem)/1.1 var(--display); letter-spacing: .16em; color: var(--ivory); text-shadow: 0 0 24px rgba(240, 210, 122, .45); }
  .who:empty, .who.empty { display: none; }
  body.celebrate .who { animation: enter 1.6s var(--ease) 3.4s both; }

  .stage { position: relative; width: min(440px, 88vw, calc(42svh * .89)); opacity: 0; }
  body.cake .stage { animation: cakeIn 1.8s var(--ease) .5s both; }
  @keyframes cakeIn { from { opacity: 0; transform: translateY(60px) scale(.94); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .stage::before {
    content: ""; position: absolute; inset: -18%; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 50% 55%, rgba(255, 215, 140, .35), transparent 62%);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .55; transform: scale(1.06); } }
  .stage svg.cake { width: 100%; height: auto; display: block; overflow: visible; animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-7px); } }

  .sparkle { position: absolute; width: 22px; color: var(--gold-light); opacity: 0; animation: tw 3.2s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

  .half { transition: transform 1.2s var(--ease); }
  .half.left, .half.right { transform-origin: 200px 305px; }
  body.cut .half.left  { transform: translateX(-20px) rotate(-3deg); }
  body.cut .half.right { transform: translateX(20px)  rotate(3deg); }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .4s infinite alternate ease-in-out; }
  .glow  { transform-box: fill-box; transform-origin: 50% 50%;  animation: pulse 2.4s infinite alternate ease-in-out; }
  @keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.88, 1.12) rotate(3deg); } }
  @keyframes pulse   { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.12); } }

  #knife { opacity: 0; transform: translateY(-120px); }
  #knife.down { opacity: 1; transform: translateY(300px); transition: transform 1s cubic-bezier(.6, 0, .85, .5), opacity .25s; }
  #knife.up   { opacity: 0; transform: translateY(-120px); transition: transform .9s ease-in, opacity .9s; }

  .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; min-height: 3.4rem; }
  .actions .btn:not([hidden]) { animation: enter 1s var(--ease) both; }

  /* ================= greeting card ================= */
  .overlay {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; overflow: hidden;
    background: rgba(3, 8, 20, .72); opacity: 0; visibility: hidden; transition: opacity .6s, visibility 0s .6s;
  }
  .overlay.show { opacity: 1; visibility: visible; transition: opacity .6s; }
  .close { position: absolute; top: calc(1rem + env(safe-area-inset-top, 0px)); right: calc(1rem + env(safe-area-inset-right, 0px)); width: 46px; height: 46px; padding: 0; font-size: 1rem; }

  .card {
    --w: min(360px, 88vw, 60svh);
    position: relative; width: var(--w); height: min(calc(var(--w) * 1.32), 86svh); perspective: 1500px;
    transform: translateY(60px) scale(.94); transition: transform 1.1s var(--ease);
  }
  .overlay.show .card { transform: none; }

  .inside {
    position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; padding: 1.9rem 1.6rem; text-align: center;
    background: radial-gradient(circle at 50% 0%, #fff, #fffaf0 65%, #f6ecd6);
    color: var(--navy); display: flex; flex-direction: column; align-items: center; gap: .7rem;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .6);
  }
  .inside::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(201, 154, 70, .75); border-radius: 3px 9px 9px 3px; pointer-events: none; }
  .inside::-webkit-scrollbar { display: none; }
  .inside > :first-child { margin-top: auto; }
  .inside > :last-child { margin-bottom: auto; }
  .inside h2 { font: 600 clamp(1.15rem, 4.7vw, 1.5rem)/1.3 var(--display); letter-spacing: .05em; color: var(--navy); }
  .inside p  { font: italic 500 clamp(1.1rem, 4.6vw, 1.32rem)/1.4 var(--serif); color: #24365e; }
  .inside .fav {
    font: 600 .8rem/1 var(--sans); font-style: normal; letter-spacing: .12em; color: #0b1b3a;
    padding: .6rem 1.1rem; border-radius: 999px; background: linear-gradient(135deg, #fbe7a1, #d4af37);
    box-shadow: 0 4px 12px rgba(212, 175, 55, .35); text-transform: uppercase;
  }
  .inside .fav:empty { display: none; }
  .inside .from { font: italic 600 1.55rem/1 var(--serif); color: #a8801a; }
  .inside .orn { color: var(--gold); letter-spacing: .5em; font-size: .8rem; }
  .photo { width: 60%; aspect-ratio: 4 / 3; object-fit: cover; border: 5px solid #fff; border-radius: 4px; rotate: -2deg; box-shadow: 0 8px 18px rgba(11, 27, 58, .3); }
  .inside.has-photo { gap: .45rem; padding-top: 1.5rem; }
  .inside.has-photo .orn { display: none; }
  .inside.has-photo h2 { font-size: clamp(1rem, 4vw, 1.25rem); }
  .inside.has-photo p { font-size: 1.12rem; line-height: 1.3; }

  .cover {
    position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(.5, 0, .15, 1), opacity .7s 1.1s;
  }
  .overlay.open .cover { transform: rotateY(-165deg); opacity: 0; }
  .cover .face { position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .cover .front {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; text-align: center;
    background: radial-gradient(circle at 30% 8%, rgba(255,255,255,.14), transparent 45%), linear-gradient(150deg, #1d3d80, #0b1b3a 70%);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .6);
  }
  .cover .front::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(240, 210, 122, .75); border-radius: 3px 9px 9px 3px; pointer-events: none; }
  .cover .front .gold {
    font: 600 clamp(1.9rem, 7.6vw, 2.5rem)/1.2 var(--display); letter-spacing: .06em; padding: .05em .1em .1em;
    background: var(--goldtext); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cover .front .orn { color: var(--gold-light); letter-spacing: .5em; font-size: .8rem; }
  .seal {
    width: 46px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; margin-top: .8rem;
    font: 700 1.2rem var(--display); color: #0b1b3a;
    background: radial-gradient(circle at 35% 30%, #ffe7a8, #d9ae43 60%, #a8801a);
    box-shadow: inset 0 -3px 6px rgba(80,50,0,.3), 0 3px 8px rgba(0,0,0,.4);
  }
  .cover .back { transform: rotateY(180deg); background: #fffaf0; }

  @media (max-height: 640px) {
    .script { font-size: clamp(2rem, 8vw, 3.2rem); }
    .who .nm { font-size: 1.25rem; }
    .wish { font-size: 1.4rem; }
    .intro h1 { font-size: clamp(1.9rem, 7vw, 3.2rem); }
  }
  @media (orientation: landscape) and (max-height: 520px) {
    main {
      grid-template-columns: 1fr 1fr; grid-template-areas: "head stage" "act stage";
      align-items: center; column-gap: 2vw; padding-top: calc(var(--vtop) + .6rem);
    }
    .headline { grid-area: head; min-height: 0; }
    .stage { grid-area: stage; width: min(44vw, calc(66svh * .89)); }
    .actions { grid-area: act; }
    .intro { gap: .6rem; }
    .intro h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); }
    .card { --w: min(520px, 88vw); height: 86svh; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flame, .glow, .stage svg.cake, .rise, .sparkle, .stage::before { animation: none; }
    .curtain { transition-duration: .6s; }
  }
</style>
</head>
<body>

<!-- ================= background ================= -->
<div class="bg"></div>
<div class="spot"></div>
<canvas id="bubbles" class="layer"></canvas>
<div class="rising" id="rising" aria-hidden="true"></div>
<canvas id="fx" class="layer"></canvas>

<button class="btn sound" id="sound" type="button" aria-label="Toggle music" hidden>&#9834;</button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="spk" viewBox="0 0 24 24"><path d="M12 0 C12 7 17 12 24 12 C17 12 12 17 12 24 C12 17 7 12 0 12 C7 12 12 7 12 0Z" fill="currentColor"/></symbol>
</svg>

<!-- ================= curtains ================= -->
<div class="curtain l" aria-hidden="true"></div>
<div class="curtain r" aria-hidden="true"></div>
<div class="valance" aria-hidden="true"></div>

<section class="intro" id="intro">
  <h1 id="introTitle">For you</h1>
  <div class="divider" aria-hidden="true"><i></i></div>
  <p>Please join us for a little birthday celebration.</p>
  <div class="reveal"><button class="btn primary" id="openBtn" type="button">Enter</button></div>
</section>

<!-- ================= cake scene ================= -->
<main>
  <div class="headline">
    <p class="wish">Close your eyes and make a wish</p>
    <h1 class="title" aria-label="Happy Birthday">
      <span class="script" aria-hidden="true"><span class="w w1">Happy</span> <span class="w w2">Birthday</span></span>
      <span class="who" id="who"><span class="divider" aria-hidden="true"><i></i></span><span class="nm" id="whoName"></span></span>
    </h1>
  </div>

  <div class="stage">
    <svg class="sparkle" style="top:6%;left:2%;animation-delay:.2s" viewBox="0 0 24 24"><use href="#spk"/></svg>
    <svg class="sparkle" style="top:2%;right:8%;width:16px;animation-delay:1.1s" viewBox="0 0 24 24"><use href="#spk"/></svg>
    <svg class="sparkle" style="top:42%;left:-4%;width:15px;animation-delay:2s" viewBox="0 0 24 24"><use href="#spk"/></svg>
    <svg class="sparkle" style="top:38%;right:-3%;animation-delay:.7s" viewBox="0 0 24 24"><use href="#spk"/></svg>
    <svg class="sparkle" style="bottom:12%;left:6%;width:14px;animation-delay:1.6s" viewBox="0 0 24 24"><use href="#spk"/></svg>
    <svg class="sparkle" style="bottom:8%;right:4%;width:18px;animation-delay:2.5s" viewBox="0 0 24 24"><use href="#spk"/></svg>

    <svg class="cake" viewBox="0 -120 400 450" role="img" aria-label="A navy and gold birthday cake with four lit candles">
      <defs>
        <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3f82"/><stop offset="1" stop-color="#0b1b3a"/></linearGradient>
        <linearGradient id="gIvory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#f2e8d2"/></linearGradient>
        <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#f6dc9a"/></linearGradient>
        <linearGradient id="gGoldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
        <linearGradient id="gCandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe3cf"/><stop offset=".45" stop-color="#fffdf8"/><stop offset="1" stop-color="#e6d6bd"/></linearGradient>

<!-- ================= greeting card ================= -->
<div class="overlay" id="overlay">
  <button class="btn close" id="closeCard" type="button" aria-label="Close card">&#10005;</button>
  <div class="card">
    <div class="inside" id="inside">
      <h2 id="cardTitle">Happy Birthday</h2>
      <p id="cardMessage"></p>
      <p class="fav" id="cardFav"></p>
      <p class="from" id="cardFrom"></p>
      <div class="orn" aria-hidden="true">&#10022; &#10022; &#10022;</div>
    </div>
    <div class="cover">
      <div class="face front">
        <div class="orn" aria-hidden="true">&#10022;</div>
        <div class="gold">Happy<br>Birthday</div>
        <div class="orn" aria-hidden="true">&#10022;</div>
        <div class="seal" id="seal" aria-hidden="true">&#10022;</div>
      </div>
      <div class="face back"></div>
    </div>
  </div>

<canvas id="confetti" class="layer"></canvas>

<script>
  /* ================= EDIT THESE ================= */
  const TITLE   = "Miss";      // shown before her name ("" to remove)
  const NAME    = "Samra";
  const MESSAGE = "Wishing you a day full of smiles, good food and great memories. I hope this year turns out to be your best one yet!";
  const FROM    = "Manaf";
  const FAV     = "You are my favourite";   // the highlighted line on the card ("" to hide)
  const PHOTO   = "";   // optional: put a picture in this folder, e.g. "samra.jpg"
  const MUSIC   = "";   // optional: put a song in this folder, e.g. "song.mp3"
  /* ============================================== */

  const base = new URLSearchParams(location.search).get("name") || NAME;
  const who = base ? (TITLE + " " + base).trim() : "";
  const body = document.body;
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- text, photo ---------- */
  $("introTitle").textContent = who ? "For " + who : "For you";
  $("whoName").textContent = who;
  if (!who) $("who").classList.add("empty");
  $("cardTitle").textContent = who ? "Happy Birthday, " + who : "Happy Birthday";
  $("cardMessage").textContent = MESSAGE;
  $("cardFav").textContent = FAV;
  $("cardFrom").textContent = FROM ? "\u2014 " + FROM : "";
  $("seal").textContent = base ? base.trim().charAt(0).toUpperCase() : "\u2726";
  if (PHOTO) {
    const img = document.createElement("img");
    img.className = "photo"; img.alt = ""; img.src = PHOTO;
    img.onerror = () => { img.remove(); $("inside").classList.remove("has-photo"); };
    $("inside").insertBefore(img, $("cardTitle"));
    $("inside").classList.add("has-photo");
  }

  /* ---------- music ---------- */
  const soundBtn = $("sound");
  let audio = null, muted = false;
  if (MUSIC) {
    audio = new Audio(MUSIC); audio.loop = true; audio.volume = 0;
    soundBtn.hidden = false;
    soundBtn.addEventListener("click", () => {
      muted = !muted; audio.volume = muted ? 0 : .7; soundBtn.classList.toggle("off", muted);
    });
  }
  function startMusic() {
    if (!audio) return;
    audio.play().then(() => {
      let v = 0;
      const t = setInterval(() => { v = Math.min(.7, v + .03); audio.volume = muted ? 0 : v; if (v >= .7) clearInterval(t); }, 120);
    }).catch(() => {});
  }

  /* ---------- canvases ---------- */
  const bubblesCv = $("bubbles"), bctx = bubblesCv.getContext("2d");
  const fx = $("fx"), ctx = fx.getContext("2d");
  const cc = $("confetti"), cctx = cc.getContext("2d");
  let W, H, bubbles = [], heat = 0;

  function newBubble(initial) {
    const r = rand(1.5, 9);
    return { x: rand(0, W), y: initial ? rand(0, H) : H + r + rand(0, 40), r,
             vy: reduceMotion ? 0 : rand(.25, .9) * (1 + r / 14), ph: rand(0, 6.28), sw: rand(.5, 1.6),
             hue: Math.random() < .7 ? 42 : 210, a: rand(.15, .42) };
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    [bubblesCv, fx, cc].forEach(c => { c.width = W * dpr; c.height = H * dpr; });
    [bctx, ctx, cctx].forEach(c => c.setTransform(dpr, 0, 0, dpr, 0, 0));
    bubbles = Array.from({ length: Math.round(W * H / 14000) + 18 }, () => newBubble(true));
  }

  /* ---------- foil confetti ---------- */
  const FOIL    = ["#f0d27a", "#d4af37", "#fbf6ea", "#c9d3e0", "#6ea8fe", "#f8e3a0"];
  const GLITTER = ["#f6dfa6", "#d4af37", "#fff6d6"];
  let pieces = [];

  function makePiece(x, y, vx, vy, isBurst, forceKind) {
    const r = Math.random();
    const kind = forceKind || (r < .55 ? "rect" : r < .75 ? "dot" : "glitter");
    return { x, y, vx, vy, kind, burst: isBurst, rot: rand(0, 6.28), vr: rand(-.2, .2), ph: rand(0, 6.28),
             w: rand(6, 10), h: rand(10, 15), s: kind === "glitter" ? rand(2, 4.2) : rand(3, 5),
             c: kind === "glitter" ? pick(GLITTER) : pick(FOIL) };
  }
  const ambient = initial => makePiece(rand(0, W), initial ? rand(-H, H) : rand(-40, -10), 0, rand(.6, 1.3), false, Math.random() < .7 ? "rect" : "dot");
  function burst(x, y, count = 60, power = 1) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(3, 12) * power;
      pieces.push(makePiece(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 3 * power, true));
    }
  }
  function seedAmbient() {
    pieces = pieces.filter(p => p.burst);
    if (reduceMotion) return;
    const count = Math.round(W / 110) + 5;
    for (let i = 0; i < count; i++) pieces.push(ambient(true));
  }
  resize(); seedAmbient();
  // phone browsers fire "resize" when the address bar hides; only rebuild on real changes
  let lastW = innerWidth, lastH = innerHeight;
  addEventListener("resize", () => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) return;
    lastW = innerWidth; lastH = innerHeight;
    resize(); seedAmbient();
  });
  addEventListener("pointerdown", e => { if (!e.target.closest(".overlay")) burst(e.clientX, e.clientY, 12, .5); });

  /* ---------- fireworks ---------- */
  const rockets = [], sparks = [];
  const FW = [{ h: 45, s: 95 }, { h: 40, s: 90 }, { h: 210, s: 85 }, { h: 48, s: 25 }, { h: 200, s: 35 }];
  function launch() {
    const x = rand(W * .1, W * .9), tx = x + rand(-60, 60), ty = rand(H * .12, H * .45), steps = rand(42, 62);
    rockets.push({ x, y: H, vx: (tx - x) / steps, vy: (ty - H) / steps, steps });
  }
  function explode(x, y) {
    const c = pick(FW), ring = Math.random() < .35, count = 90;
    for (let i = 0; i < count; i++) {
      const a = Math.PI * 2 * i / count, sp = ring ? 4 : rand(1.2, 5.5);
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: rand(.010, .020), hue: c.h + rand(-8, 8), sat: c.s });
    }
  }

  function frame(t) {
    t /= 1000;
    heat += ((body.classList.contains("celebrate") ? 1 : 0) - heat) * .02;

    // champagne bubbles
    bctx.clearRect(0, 0, W, H);
    for (const b of bubbles) {
      b.y -= b.vy * (1 + heat * .8); b.x += Math.sin(t * b.sw + b.ph) * .3;
      if (b.y < -b.r - 10) Object.assign(b, newBubble(false));
      const a = b.a * (.75 + .25 * Math.sin(t * 1.5 + b.ph));
      bctx.beginPath(); bctx.arc(b.x, b.y, b.r, 0, 7);
      bctx.fillStyle = `hsla(${b.hue},80%,80%,${a * .12})`; bctx.fill();
      bctx.strokeStyle = `hsla(${b.hue},80%,82%,${a})`; bctx.lineWidth = 1; bctx.stroke();
      if (b.r > 3.5) { bctx.beginPath(); bctx.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .22, 0, 7); bctx.fillStyle = `rgba(255,255,255,${a})`; bctx.fill(); }
    }

    // confetti and glitter
    cctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      if (p.burst) { p.vy += .2; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; }
      else { p.y += p.vy; p.x += Math.sin(p.ph * .6 + p.y * .015) * .7; }
      p.rot += p.vr; p.ph += .08;
      if (p.y > H + 30) { if (p.burst) { pieces.splice(i, 1); continue; } Object.assign(p, ambient(false)); }
      cctx.save();
      cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.c;
      if (p.kind === "rect") { const f = Math.abs(Math.cos(p.ph)); cctx.globalAlpha = .95; cctx.fillRect(-p.w / 2, -p.h / 2 * f, p.w, p.h * f); }
      else if (p.kind === "dot") { cctx.globalAlpha = .95; cctx.beginPath(); cctx.arc(0, 0, p.s, 0, 7); cctx.fill(); }
      else {
        cctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(p.ph * 1.6));
        cctx.beginPath(); cctx.moveTo(0, -p.s); cctx.lineTo(p.s * .6, 0); cctx.lineTo(0, p.s); cctx.lineTo(-p.s * .6, 0); cctx.fill();
      }
      cctx.restore();
    }

    // fireworks
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.steps--;
      ctx.fillStyle = "#ffeec0";
      ctx.beginPath(); ctx.arc(r.x, r.y, 2.2, 0, 7); ctx.fill();
      if (r.steps <= 0) { explode(r.x, r.y); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.vx *= .98; s.vy = s.vy * .98 + .045;
      s.x += s.vx; s.y += s.vy; s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${s.hue},${s.sat}%,68%,${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.1, 0, 7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let show = null;
  function startShow() {
    for (let i = 0; i < 5; i++) setTimeout(launch, i * 280);
    show = setInterval(() => { launch(); if (Math.random() < .45) setTimeout(launch, 240); }, 1000);
  }
  function stopShow() { clearInterval(show); show = null; }

  /* ---------- rising stars ---------- */
  const risingEl = $("rising");
  const STARS = ["#f0d27a", "#d4af37", "#fbf6ea", "#8fb4ff"];
  let riseTimer = null;
  function rise() {
    if (risingEl.children.length > 14) return;
    const el = document.createElement("div");
    el.className = "rise";
    el.style.cssText = `--s:${rand(14, 30)}px;--x:${rand(3, 94)}vw;--dx:${rand(-10, 10)}vw;--dur:${rand(10, 16)}s;--spin:${rand(8, 16)}s;--c:${pick(STARS)}`;
    el.innerHTML = '<svg viewBox="0 0 24 24"><use href="#spk"/></svg>';
    el.addEventListener("animationend", e => { if (e.animationName === "floatUp") el.remove(); });
    risingEl.appendChild(el);
  }
  function startRising() {
    if (reduceMotion) return;
    for (let i = 0; i < 4; i++) setTimeout(rise, i * 450);
    riseTimer = setInterval(rise, 900);
  }
  function stopRising() { clearInterval(riseTimer); riseTimer = null; }

  /* ---------- greeting card ---------- */
  const overlay = $("overlay"), cardBtn = $("cardBtn"), closeBtn = $("closeCard");
  let openTimer, autoTimer;
  function openCard() {
    clearTimeout(openTimer);
    overlay.classList.remove("open");
    overlay.classList.add("show");
    openTimer = setTimeout(() => { overlay.classList.add("open"); burst(W / 2, H / 2, 40, .8); }, 1200);
    closeBtn.focus();
  }
  function closeCard(refocus = true) {
    clearTimeout(openTimer);
    const wasOpen = overlay.classList.contains("show");
    overlay.classList.remove("show", "open");
    if (refocus && wasOpen && !cardBtn.hidden) cardBtn.focus();
  }
  cardBtn.addEventListener("click", openCard);
  closeBtn.addEventListener("click", () => closeCard());
  addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
  overlay.addEventListener("click", e => { if (e.target === overlay) closeCard(); });

  /* ---------- the sequence ---------- */
  const knife = $("knife"), cutBtn = $("cutBtn"), replayBtn = $("replayBtn");

  // 1) enter -> the curtains part and the cake appears in the spotlight
  $("openBtn").addEventListener("click", () => {
    if (body.classList.contains("opened")) return;
    body.classList.add("opened");
    $("openBtn").disabled = true;
    startMusic();
    setTimeout(() => body.classList.add("cake"), 700);
    setTimeout(() => { burst(W * .08, H * .75, 45, 1); burst(W * .92, H * .75, 45, 1); }, 1800);
    setTimeout(() => body.classList.add("dressed"), 3400);
    setTimeout(() => { cutBtn.hidden = false; }, 4600);
  });

  // 2) cut the cake -> fireworks, stars, title
  cutBtn.addEventListener("click", () => {
    cutBtn.disabled = true;
    knife.classList.remove("up");
    knife.classList.add("down");

    setTimeout(() => {
      body.classList.add("cut", "celebrate");
      startShow();
      startRising();
      burst(W * .25, H * .6, 50, 1);
      burst(W * .75, H * .6, 50, 1);
    }, 1000);

    setTimeout(() => { knife.classList.remove("down"); knife.classList.add("up"); }, 1200);

    setTimeout(() => {
      cutBtn.hidden = true;
      cardBtn.hidden = false;
      replayBtn.hidden = false;
    }, 4200);

    autoTimer = setTimeout(openCard, 9000);   // the card opens by itself
  });

  // 3) replay from the cake
  replayBtn.addEventListener("click", () => {
    clearTimeout(autoTimer);
    closeCard(false);
    stopShow();
    stopRising();
    risingEl.style.opacity = 0;
    setTimeout(() => { risingEl.innerHTML = ""; risingEl.style.opacity = ""; }, 700);
    body.classList.remove("cut", "celebrate");
    knife.classList.remove("down", "up");
    cardBtn.hidden = true;
    replayBtn.hidden = true;
    cutBtn.disabled = false;
    cutBtn.hidden = false;
  });
</script>
</body>
</html>
